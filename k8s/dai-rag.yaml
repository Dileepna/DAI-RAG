apiVersion: v1
kind: ConfigMap
metadata:
  name: windfarm-rag
data:
  DATABASE_URL: jdbc:postgresql://postgres.example.internal:5432/windfarm
  QDRANT_HOST: qdrant.example.internal
  OLLAMA_BASE_URL: http://ollama.example.internal:11434
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windfarm-rag
spec:
  replicas: 2
  selector:
    matchLabels: { app: windfarm-rag }
  template:
    metadata:
      labels: { app: windfarm-rag }
    spec:
      containers:
        - name: app
          image: windfarm-rag:1.0.0
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: windfarm-rag } }]
          env:
            - { name: DATABASE_USER, valueFrom: { secretKeyRef: { name: windfarm-secrets, key: database-user } } }
            - { name: DATABASE_PASSWORD, valueFrom: { secretKeyRef: { name: windfarm-secrets, key: database-password } } }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 3Gi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: windfarm-rag
spec:
  selector: { app: windfarm-rag }
  ports: [{ port: 80, targetPort: 8080 }]
