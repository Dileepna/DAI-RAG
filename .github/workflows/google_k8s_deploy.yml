name: Deploy DAI-RAG to Google Kubernetes Engine

on:
  workflow_run:
    workflows: ["Build and publish Docker image"]
    types: [completed]
    branches: ["master"]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/dileepna/dai-rag
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out the build's commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_LOCATION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure GHCR image pull access
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/dai-rag.yaml

      - name: Configure image pull secret
        run: |
          kubectl patch deployment windfarm-rag --type=merge \
            -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ghcr-secret"}]}}}}'

      - name: Update deployment to the image built by this run
        run: |
          kubectl set image deployment/windfarm-rag \
            app="$IMAGE:$IMAGE_TAG"
          kubectl rollout status deployment/windfarm-rag --timeout=180s
